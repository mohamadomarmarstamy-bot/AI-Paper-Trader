name: Backend regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: /tmp/paper-trader-tests.db
      AUTO_TRADER_START_ENABLED: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt 'pytest>=8,<9'
      - run: python -m pytest backend -q
