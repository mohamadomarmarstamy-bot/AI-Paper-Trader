name: Jarvis paper check (no changes)
on:
  pull_request:
    paths:
      - '.github/workflows/jarvis-paper-check.yml'
      - 'backend/jarvis_research.py'
      - 'backend/jarvis_test_bot.py'
      - 'backend/test_solana_jarvis_research.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# This diagnostic has no repair coordinator access and no repository write token.
permissions:
  contents: read

concurrency:
  group: jarvis-paper-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chart-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install
          'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'requests>=2.32,<3'
          'cryptography>=46,<51' 'solders==0.29.0' 'websockets>=16,<17'
      - name: Verify two paper chart regressions using fixtures only
        env:
          PYTHONPATH: backend
        run: >-
          python -m unittest -v
          test_solana_jarvis_research.JarvisResearchTests.test_chart_refresh_cannot_replace_fresh_evidence_with_older_or_weaker_chart
          test_solana_jarvis_research.JarvisResearchTests.test_successful_responses_without_candles_recover_pace_not_trade_evidence
      - name: Record check-only heartbeat
        run: |
          printf 'Jarvis paper fixture checks passed at %s UTC.\n\nEvent: %s. Commit: %s.\n' \
            "$(date -u '+%Y-%m-%d %H:%M:%S')" "$GITHUB_EVENT_NAME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
