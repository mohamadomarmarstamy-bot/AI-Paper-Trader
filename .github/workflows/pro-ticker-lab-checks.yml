name: Pro Ticker Lab checks

on:
  push:
    branches:
      - feature/pro-ticker-lab
  pull_request:
    paths:
      - 'backend/pro_ticker_manual_intake.py'
      - 'backend/pro_ticker_paper_policy.py'
      - 'backend/pro_ticker_budget_ledger.py'
      - 'backend/pro_ticker_reconciliation_review.py'
      - 'backend/pro_ticker_order_ownership.py'
      - 'backend/pro_ticker_execution_plan.py'
      - 'backend/pro_ticker_exit_plan.py'
      - 'backend/pro_ticker_fill_verification.py'
      - 'backend/pro_ticker_snapshot_review.py'
      - 'backend/pro_ticker_exit_attribution.py'
      - 'backend/pro_ticker_position_accounting.py'
      - 'backend/pro_ticker_position_ledger.py'
      - 'backend/pro_ticker_position_audit.py'
      - 'backend/pro_ticker_fill_posting_preview.py'
      - 'backend/pro_ticker_order_linking.py'
      - 'backend/pro_ticker_verified_fill_bridge.py'
      - 'backend/test_pro_ticker_verified_fill_bridge.py'
      - 'backend/test_pro_ticker_paper_fill_lifecycle.py'
      - 'backend/test_pro_ticker_order_linking.py'
      - 'backend/test_pro_ticker_fill_posting_preview.py'
      - 'backend/test_pro_ticker_position_audit.py'
      - 'backend/test_pro_ticker_position_ledger.py'
      - 'backend/test_pro_ticker_position_accounting.py'
      - 'backend/test_pro_ticker_exit_attribution.py'
      - 'backend/test_pro_ticker_snapshot_review.py'
      - 'backend/test_pro_ticker_fill_verification.py'
      - 'backend/test_pro_ticker_exit_plan.py'
      - 'backend/test_pro_ticker_execution_plan.py'
      - 'backend/test_pro_ticker_order_ownership.py'
      - 'backend/test_pro_ticker_reconciliation_review.py'
      - 'backend/test_pro_ticker_budget_ledger.py'
      - 'backend/test_pro_ticker_paper_policy.py'
      - 'backend/test_pro_ticker_manual_intake.py'
      - 'backend/frontend/js/pro-ticker-manual.js'
      - 'backend/frontend/index.html'
      - 'backend/main.py'
      - '.github/workflows/pro-ticker-lab-checks.yml'

jobs:
  intake-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m py_compile backend/pro_ticker_manual_intake.py backend/pro_ticker_paper_policy.py backend/pro_ticker_budget_ledger.py backend/pro_ticker_reconciliation_review.py backend/pro_ticker_order_ownership.py backend/pro_ticker_execution_plan.py backend/pro_ticker_exit_plan.py backend/pro_ticker_fill_verification.py backend/pro_ticker_snapshot_review.py backend/pro_ticker_exit_attribution.py backend/pro_ticker_position_accounting.py backend/pro_ticker_position_ledger.py backend/pro_ticker_position_audit.py backend/pro_ticker_fill_posting_preview.py backend/pro_ticker_order_linking.py backend/pro_ticker_verified_fill_bridge.py backend/main.py backend/test_pro_ticker_manual_intake.py backend/test_pro_ticker_budget_ledger.py backend/test_pro_ticker_paper_policy.py backend/test_pro_ticker_reconciliation_review.py
      - name: Manual research intake unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_manual_intake.py -v
      - name: PAPER order admission policy unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_paper_policy.py -v
      - name: Virtual PAPER budget ledger unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_budget_ledger.py -v
      - name: PAPER reconciliation review unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_reconciliation_review.py -v
      - name: PAPER order ownership unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_order_ownership.py -v
      - name: PAPER entry planning unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_execution_plan.py -v
      - name: PAPER exit planning unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_exit_plan.py -v
      - name: PAPER broker fill verification unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_fill_verification.py -v
      - name: PAPER snapshot reconciliation integration tests
        run: python -m unittest discover -s backend -p test_pro_ticker_snapshot_review.py -v
      - name: PAPER strategy exit attribution unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_exit_attribution.py -v
      - name: PAPER position accounting unit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_position_accounting.py -v
      - name: PAPER position ledger integration tests
        run: python -m unittest discover -s backend -p test_pro_ticker_position_ledger.py -v
      - name: PAPER shared broker position audit tests
        run: python -m unittest discover -s backend -p test_pro_ticker_position_audit.py -v
      - name: PAPER fill posting preview tests
        run: python -m unittest discover -s backend -p test_pro_ticker_fill_posting_preview.py -v
      - name: PAPER reservation order linking tests
        run: python -m unittest discover -s backend -p test_pro_ticker_order_linking.py -v
      - name: Verified PAPER entry fill bridge tests
        run: python -m unittest discover -s backend -p test_pro_ticker_verified_fill_bridge.py -v
      - name: End-to-end PAPER fill ledger lifecycle tests
        run: python -m unittest discover -s backend -p test_pro_ticker_paper_fill_lifecycle.py -v
      - name: Frontend JavaScript syntax check
        run: node --check backend/frontend/js/pro-ticker-manual.js
